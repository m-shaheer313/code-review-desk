[project]
name = "code-review-desk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chainlit>=2.12.0",
    "openai-agents>=0.22.3",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Tests live in tests/; the product modules they import live at the project root.
# `pythonpath` puts the root on sys.path for the test session (pytest's own
# mechanism, pytest >= 7), so `from finding import Finding` resolves unchanged.
testpaths = ["tests"]
pythonpath = ["."]
